name: Daily data refresh

on:
  schedule:
    - cron: "17 6 * * *" # 2:17am EDT / 1:17am EST — must stay after midnight ET year-round
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run fetch
        env:
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY || '123' }}
      - run: npm run compile
      - run: npm run snapshot
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "Daily data refresh"
            git push
          fi
