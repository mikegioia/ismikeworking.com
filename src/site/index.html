<!DOCTYPE html>
<html lang="en" class="theme-jewel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Is Mike Working Today?</title>
  <meta name="description" content="A very serious real-time answer to a very serious question.">
  <script>{{THEME_BOOT}}</script>
  <style>{{STYLES}}</style>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
</head>
<body class="level-{{LEVEL}}">
  <main>
    <p class="question">Is Mike working today?</p>
    <h1 id="verdict">{{VERDICT}}</h1>
    <p class="reason" id="reason">{{REASON}}</p>
    <details class="why" id="why">
      <summary>why?</summary>
      <div id="breakdown">{{BREAKDOWN}}</div>
    </details>
    <footer>
      <small id="updated">report for {{REPORT_DATE}}</small>
      <small class="stale-hint" id="stale-hint" hidden></small>
      <div class="themes" id="themes">
        <button class="swatch-jewel" data-theme="jewel" title="Jewel" aria-label="Jewel theme"></button>
        <button class="swatch-twilight" data-theme="twilight" title="Twilight" aria-label="Twilight theme"></button>
        <button class="swatch-soft" data-theme="soft" title="Soft Serve" aria-label="Soft Serve theme"></button>
      </div>
      <button class="history-link" id="history-toggle" aria-expanded="false">history</button>
    </footer>
    <section class="history" id="history" hidden>
      <div class="cal-nav">
        <button id="cal-prev" aria-label="Previous month">◀</button>
        <span id="cal-title"></span>
        <button id="cal-next" aria-label="Next month">▶</button>
      </div>
      <div id="cal-grid"></div>
      <div id="cal-detail"></div>
    </section>
  </main>
  <script type="module" src="/assets/main.js"></script>
</body>
</html>
